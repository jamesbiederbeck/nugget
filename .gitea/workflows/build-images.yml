name: Build Images
run-name: ${{ gitea.actor }} built images

# Registry-agnostic: set these repo/org variables in your Gitea instance.
#   vars.REGISTRY          — container registry host (e.g. git.example.com)
#   vars.CI_RUNNER_IMAGE   — dind-capable runner image for the job container
#   vars.AGENT_BASE_IMAGE  — base image for Dockerfile.agent
#   vars.AGENT_IMAGE       — full name for the published nugget-agent image
#   vars.GOTIFY_URL        — optional; build notifications are skipped if unset
# Secrets: GITEAPASSWORD (registry login), GOTIFY_TOKEN (if GOTIFY_URL is set).

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'ROADMAP.md'
      - 'tool_docs/**'

jobs:
  Build-Images:
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.CI_RUNNER_IMAGE }}
      volumes:
        - toolcache:/toolcache
    env:
      RUNNER_TOOL_CACHE: /toolcache

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ vars.GITEAUSERNAME }}
          password: ${{ secrets.GITEAPASSWORD }}

      - name: Notify build start
        if: vars.GOTIFY_URL != ''
        run: |
          curl -sf -X POST "${{ vars.GOTIFY_URL }}/message?token=${{ secrets.GOTIFY_TOKEN }}" \
            -F "title=Build Started — ${{ gitea.repository }}" \
            -F "message=${{ gitea.ref }} @ ${{ gitea.sha }}"

      # --- nugget (regular) ---

      - name: Docker Meta (nugget)
        id: meta-nugget
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.REGISTRY }}/${{ gitea.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable=${{ gitea.ref == 'refs/heads/main' }}

      - name: Build and push nugget
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: ${{ steps.meta-nugget.outputs.tags }}
          push: true

      # --- nugget-agent (dind base) ---

      - name: Docker Meta (nugget-agent)
        id: meta-agent
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.AGENT_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable=${{ gitea.ref == 'refs/heads/main' }}

      - name: Build and push nugget-agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent
          build-args: |
            BASE_IMAGE=${{ vars.AGENT_BASE_IMAGE }}
          tags: ${{ steps.meta-agent.outputs.tags }}
          push: true

      - name: Notify build done
        if: always() && vars.GOTIFY_URL != ''
        run: |
          curl -sf -X POST "${{ vars.GOTIFY_URL }}/message?token=${{ secrets.GOTIFY_TOKEN }}" \
            -F "title=Build Finished — ${{ gitea.repository }}" \
            -F "message=${{ gitea.ref }} @ ${{ gitea.sha }} — status: ${{ job.status }}"
