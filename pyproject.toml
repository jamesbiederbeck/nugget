[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nugget"
version = "0.9.0"
description = "CLI chat interface for a locally-hosted model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "jinja2",
    "jmespath",
    "prompt-toolkit>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock", "mypy>=1.10", "types-requests"]
web = ["fastapi>=0.111", "uvicorn[standard]>=0.29"]
mcp = ["mcp>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nugget = ["templates/*.j2", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.mypy]
files = ["src/nugget"]
python_version = "3.11"

# jmespath ships no type information and has no stubs on PyPI. Without this,
# every import of it errors and anything derived from it degrades to `object`,
# which makes downstream call sites unverifiable rather than merely unchecked.
[[tool.mypy.overrides]]
module = ["jmespath.*"]
ignore_missing_imports = true

[project.scripts]
nugget = "nugget.__main__:main"
nugget-server = "nugget.server:main"
